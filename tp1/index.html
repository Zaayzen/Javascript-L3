<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bataille navale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Bataille navale</h1>
    <p class="subtitle">Trouvez et coulez toute la flotte adverse.</p>

    <section class="panel stats">
      <span>Tirs : <strong id="shots">0</strong></span>
      <span>Touches : <strong id="hits">0</strong></span>
      <span>Coulés : <strong id="sunk">0</strong></span>
    </section>

    <p id="message" class="message">À vous de jouer.</p>
    <div id="board" class="board" aria-label="Grille de jeu"></div>

    <section class="panel">
      <h2>Flotte</h2>
      <ul id="fleet"></ul>
    </section>

    <button id="newGameButton" type="button">Nouvelle partie</button>
  </main>

  <script src="js/ship.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/view.js"></script>  
  <script src="js/appTest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
